name: 6 - Backfill Istanbul and Munich

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Number of historical days"
        required: true
        default: "365"

permissions:
  contents: write

concurrency:
  group: weatherman-database
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Backfill only the two new trading airports
        run: >-
          python -m weatherman.cli backfill
          --days ${{ inputs.days }}
          --airports LTFM EDDM
      - name: Persist database snapshot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f data/weatherman.db
          git diff --cached --quiet || git commit -m "data: backfill Istanbul and Munich"
          git pull --rebase
          git push
