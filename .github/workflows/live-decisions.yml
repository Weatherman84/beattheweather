name: 5 - Parallel shadow watcher, fresh models and live decisions

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: weatherman-database
  cancel-in-progress: false

jobs:
  live-decisions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Refresh due models and collect live shadow evaluations
        run: python -m weatherman.cli collect-live-decisions
        env:
          METEOBLUE_API_KEY: ${{ secrets.METEOBLUE_API_KEY }}
      - name: Persist database snapshot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f data/weatherman.db
          git diff --cached --quiet || git commit -m "data: collect live decisions and shadow watch"
          # Keep only the committed database snapshot. In particular, discard
          # setuptools metadata refreshed by `pip install .` before rebasing.
          git status --short
          git restore --worktree -- .
          git pull --rebase
          git push
