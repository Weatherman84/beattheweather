name: 0C - Remove emergency recovery workflows

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type exactly REMOVE RECOVERY WORKFLOWS V10.7.6
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: weatherman-database
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check explicit cleanup confirmation
        shell: bash
        env:
          RECOVERY_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$RECOVERY_CONFIRMATION" = "REMOVE RECOVERY WORKFLOWS V10.7.6"

      - name: Download current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Remove the temporary recovery controls
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Weatherman Recovery"
          git config user.email "actions@users.noreply.github.com"
          git rm \
            .github/workflows/emergency-backup-history.yml \
            .github/workflows/emergency-compact-main.yml \
            .github/workflows/emergency-cleanup.yml
          git commit -m "Remove emergency history recovery workflows"
          git push origin HEAD:main
