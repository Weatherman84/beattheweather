name: 8 - Daily archive verification and SQLite maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

concurrency:
  group: weatherman-database
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify archives and keep the active SQLite store inside its safety band
        run: >-
          bash scripts/run_database_job.sh
          "data: daily archive verification and SQLite maintenance"
          python -m weatherman.cli audit-coverage
