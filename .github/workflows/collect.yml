name: 2 - Collect current forecasts
on:
  workflow_dispatch:
permissions:
  contents: write

concurrency:
  group: weatherman-database
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect and persist through the same controlled writer
        run: >-
          bash scripts/run_database_job.sh
          "data: forced model refresh through consolidated collector"
          python -m weatherman.cli run-collector --force-models
        env:
          METEOBLUE_API_KEY: ${{ secrets.METEOBLUE_API_KEY }}
