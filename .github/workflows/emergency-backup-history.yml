name: 0A - Emergency backup Git history

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weatherman-database
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download the complete repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and bundle the complete history
        shell: bash
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/weatherman-history-backup"
          bundle_path="$output_dir/beattheweather-full-history-${GITHUB_SHA}.bundle"
          mkdir -p "$output_dir"
          git fsck --full
          git bundle create "$bundle_path" --all
          git bundle verify "$bundle_path"
          sha256sum "$bundle_path" > "$output_dir/SHA256SUMS.txt"
          printf '%s\n' "$GITHUB_SHA" > "$output_dir/MAIN_COMMIT.txt"
          git count-objects -vH > "$output_dir/REPOSITORY_SIZE.txt"

      - name: Upload the recovery bundle
        uses: actions/upload-artifact@v4
        with:
          name: beattheweather-full-history-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/weatherman-history-backup/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Confirm backup creation
        shell: bash
        run: |
          {
            echo "## Full Git history backup created"
            echo
            echo "Download and keep the workflow artifact before running 0B."
            echo "Main commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
