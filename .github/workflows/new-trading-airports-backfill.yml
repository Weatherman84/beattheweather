name: 6 - Backfill Istanbul and Munich

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Number of historical days"
        required: true
        default: "365"

permissions:
  contents: write

concurrency:
  group: weatherman-database
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Backfill and persist the two airports on the newest database
        run: >-
          bash scripts/run_database_job.sh
          "data: backfill Istanbul and Munich"
          python -m weatherman.cli backfill
          --days "${{ inputs.days }}"
          --airports LTFM EDDM
