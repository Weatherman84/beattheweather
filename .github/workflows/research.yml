name: 4 - Collect airport research checkpoints

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weatherman-database
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Use the consolidated writer as the manual fallback
        run: >-
          bash scripts/run_database_job.sh
          "data: manual consolidated collector fallback"
          python -m weatherman.cli run-collector
