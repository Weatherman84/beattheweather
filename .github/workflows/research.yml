name: 4 - Collect airport research checkpoints

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: write

concurrency:
  group: weatherman-database
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect and persist checkpoints on the newest database
        run: >-
          bash scripts/run_database_job.sh
          "data: collect airport research checkpoints"
          python -m weatherman.cli collect-research-checkpoints --window-minutes 30
