name: 7 - Recover Stage-1 gaps (10/11 August)
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read

concurrency:
  group: weatherman-database
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Recover and classify the Stage-1 data gaps
        run: >-
          bash scripts/run_database_job.sh
          "data: recover and classify Stage-1 gaps for 10/11 August"
          python -m weatherman.cli recover-stage1-gaps
        env:
          METEOBLUE_API_KEY: ${{ secrets.METEOBLUE_API_KEY }}
