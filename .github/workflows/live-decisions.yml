name: 5 - Consolidated ten-minute collector

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write
  actions: read

concurrency:
  group: weatherman-database
  cancel-in-progress: false

jobs:
  live-decisions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Record the Actions queue timestamp
        run: echo "WEATHERMAN_SCHEDULED_AT=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }} --jq .created_at)" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Collect every due source through the single writer
        run: >-
          bash scripts/run_database_job.sh
          "data: consolidated collector"
          python -m weatherman.cli run-collector
        env:
          METEOBLUE_API_KEY: ${{ secrets.METEOBLUE_API_KEY }}
          WEATHERMAN_FAST_DATABASE_JOB: "1"
