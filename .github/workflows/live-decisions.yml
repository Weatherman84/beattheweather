name: 5 - Parallel shadow watcher, fresh models and live decisions

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: weatherman-database
  cancel-in-progress: false

jobs:
  live-decisions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh, collect and persist on the newest database
        run: >-
          bash scripts/run_database_job.sh
          "data: collect live decisions and shadow watch"
          python -m weatherman.cli collect-live-decisions
        env:
          METEOBLUE_API_KEY: ${{ secrets.METEOBLUE_API_KEY }}
